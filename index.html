<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111711" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HUNT READY 30" />
  <title>HUNT READY 30</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div><div class="eyebrow">HUNT READY</div><h1>30</h1></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </header>
    <main id="main"></main>
    <nav class="bottom-nav">
      <button data-tab="today" class="nav-btn active"><span>◉</span><small>Today</small></button>
      <button data-tab="week" class="nav-btn"><span>▦</span><small>Week</small></button>
      <button data-tab="progress" class="nav-btn"><span>↗</span><small>Progress</small></button>
      <button data-tab="history" class="nav-btn"><span>≡</span><small>History</small></button>
    </nav>
  </div>
  <div id="modalBackdrop" class="modal-backdrop hidden"><section id="modal" class="modal"></section></div>
  <script src="app.js"></script>
</body>
</html>
